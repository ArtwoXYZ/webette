# Builds the desktop app for Linux, macOS and Windows, checks that each one
# starts and builds its tutorial site, and publishes them as a release when
# a version tag arrives.
#
# webette lives on Tangled (tangled.org/artwo.xyz/webette). This repository
# is its mirror: it lends the build machines Tangled does not have, and its
# releases hold the downloads. The other checks run on Tangled.
#
# Started by hand on a branch, it publishes a draft release instead (only
# visible to the repository owner): the way to try the builds without
# releasing anything.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run package:app

      # The libraries the Linux app asks of the system, a screen, and a way
      # to photograph it.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb imagemagick
      # The virtual screen has no GPU: without software rendering, WebKitGTK
      # never repaints after its first frame.
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run check:app
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - if: runner.os != 'Linux'
        run: bun run check:app

      # What the app looked like during the check, to review its window
      # on each system without installing it.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.os }}
          path: packages/app/build/screenshot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: packages/app/artifacts/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: artifacts
          merge-multiple: true

      # release:notes fails on a tag that does not match package.json or
      # the changelog.
      - if: github.ref_type == 'tag'
        run: |
          bun run release:notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag \
            --title "webette $GITHUB_REF_NAME" --notes-file notes.md

      - if: github.ref_type != 'tag'
        run: |
          gh release create "test-$GITHUB_RUN_NUMBER" artifacts/* --draft \
            --target "$GITHUB_SHA" --title "Test build: $GITHUB_REF_NAME #$GITHUB_RUN_NUMBER" \
            --notes "Built from $GITHUB_REF_NAME at $GITHUB_SHA. Not a release."
