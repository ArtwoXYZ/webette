<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Website example 06</title>
</head>
<body>
  <h1>Website example 06</h1>
  <p>Site generated by Webette v0.0.1</p>
  <script>
    (function () {
      let lastVersion = null;
      async function check() {
        try {
          const res = await fetch("/__webette-version", { cache: "no-store" });
          if (!res.ok) return;
          const text = await res.text();
          if (lastVersion === null) {
            lastVersion = text;
          } else if (lastVersion !== text) {
            location.reload();
          }
        } catch (e) {
          // Non-fatal: we will retry later
        }
      }
      setInterval(check, 1000);
      check();
    })();
  </script>
</body>
</html>
