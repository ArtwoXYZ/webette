when:
  - event: ["push", "manual"]
    branch: ["main", "dev"]
  - event: ["pull_request"]
    branch: ["main", "dev"]

engine: nixery

dependencies:
  nixpkgs/nixpkgs-unstable:
    - bun

steps:
  - name: install
    command: bun install --frozen-lockfile

  - name: typecheck
    command: bun run typecheck

  - name: test
    command: bun test

  - name: build the tutorial site
    command: bun run build:tutorial
