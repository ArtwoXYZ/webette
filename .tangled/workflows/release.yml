when:
  - event: ["push"]
    tag: ["v*"]

engine: nixery

dependencies:
  nixpkgs/nixpkgs-unstable:
    - bun
    - gcc-unwrapped

steps:
  - name: install
    command: bun install --frozen-lockfile

  - name: typecheck
    command: bun run typecheck

  - name: test
    command: bun test

  # sharp needs the C++ runtime, which the image keeps out of the library path.
  - name: check the tutorial output
    command: |
      export LD_LIBRARY_PATH="$(dirname "$(ls /nix/store/*/lib/libstdc++.so.6 | head -n 1)")"
      bun run check:tutorial

  - name: check the release notes
    command: bun run release:notes "$TANGLED_REF_NAME"
